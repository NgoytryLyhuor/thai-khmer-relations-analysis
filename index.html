<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ស៊ីជម្រៅ Insight — ឫសគល់នៃជម្លោះ កម្ពុជា-ថៃ</title>
    <meta name="description" content="ស៊ីជម្រៅ Insight — ការវិភាគស៊ីជម្រៅលើទំនាក់ទំនងកម្ពុជា-ថៃ៖ ប្រវត្តិសាស្ត្រ, វប្បធម៌, ជម្លោះ ២០២៥ និងសេដ្ឋកិច្ចជីវិតប្រចាំថ្ងៃ" />
    <meta property="og:title" content="ស៊ីជម្រៅ Insight — ឫសគល់នៃជម្លោះ កម្ពុជា-ថៃ" />
    <meta property="og:description" content="របាយការណ៍វិភាគស៊ីជម្រៅ៖ ប្រវត្តិសាស្ត្រ, សង្គ្រាមវប្បធម៌, ជម្លោះ ២០២៥ និងសេដ្ឋកិច្ច ជីវិតប្រចាំថ្ងៃ" />

    <meta name="theme-color" content="#1e3a8a" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
</head>

</body>
